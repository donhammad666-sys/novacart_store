<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hammad Store</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      font-size: 25px;
    }

    header p {
      margin-top: 5px;
      font-size: 14px;
      color: #ccc;
    }

    .hero {
      padding: 30px 18px;
      text-align: center;
      background: white;
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
      margin-bottom: 20px;
    }

    .shop-btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 13px 25px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .products {
      padding: 20px 15px;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 18px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #ddd;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 7px;
    }

    .price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .buy-btn {
      display: block;
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 10px;
      border-radius: 7px;
      font-weight: bold;
      cursor: pointer;
    }

    .order {
      display: none;
      background: white;
      margin: 20px 15px;
      padding: 20px;
      border-radius: 12px;
    }

    .order h2 {
      margin-bottom: 15px;
    }

    .order input,
    .order textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
    }

    .location-btn,
    .submit-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 7px;
      margin-bottom: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .location-btn {
      background: #eee;
    }

    .submit-btn {
      background: #111;
      color: white;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      background: #111;
      color: #aaa;
      margin-top: 25px;
    }

    @media (max-width: 500px) {
      .product-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .product img {
        height: 150px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Hammad Store</h1>
    <p>Quality Products • Easy Ordering • Cash on Delivery</p>
  </header>

  <section class="hero">
    <h2>Shop Your Favourite Products</h2>
    <p>Order easily from your mobile with Cash on Delivery.</p>
    <a href="#products" class="shop-btn">Shop Now</a>
  </section>

  <section class="products" id="products">
    <h2>Featured Products</h2>

    <div class="product-grid">

      <div class="product">
        <img src="https://via.placeholder.com/500x500?text=Product+1" alt="Product 1">
        <div class="product-info">
          <h3>Premium Product</h3>
          <div class="price">Rs. 1,499</div>
          <button class="buy-btn" onclick="openOrder('Premium Product', '1499')">
            Buy Now
          </button>
        </div>
      </div>

      <div class="product">
        <img src="https://via.placeholder.com/500x500?text=Product+2" alt="Product 2">
        <div class="product-info">
          <h3>Trending Product</h3>
          <div class="price">Rs. 1,999</div>
          <button class="buy-btn" onclick="openOrder('Trending Product', '1999')">
            Buy Now
          </button>
        </div>
      </div>

    </div>
  </section>

  <section class="order" id="orderBox">
    <h2>Place Your Order</h2>

    <p id="selectedProduct" style="margin-bottom:15px;"></p>

    <input type="text" id="name" placeholder="Your Full Name">
    <input type="tel" id="phone" placeholder="Your Phone Number">

    <textarea id="address" rows="3" placeholder="Delivery Address"></textarea>

    <button class="location-btn" onclick="getLocation()">
      📍 Use My Current Location
    </button>

    <button class="submit-btn" onclick="submitOrder()">
      Place Order - Cash on Delivery
    </button>
  </section>

  <footer>
    <p>© 2026 Hammad Store. All Rights Reserved.</p>
  </footer>

  <script>
    let selectedProduct = "";
    let selectedPrice = "";

    function openOrder(product, price) {
      selectedProduct = product;
      selectedPrice = price;

      document.getElementById("orderBox").style.display = "block";

      document.getElementById("selectedProduct").innerText =
        "Selected: " + product + " — Rs. " + price;

      document.getElementById("orderBox").scrollIntoView({
        behavior: "smooth"
      });
    }

    function getLocation() {
      if (!navigator.geolocation) {
        alert("Your browser does not support location.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          document.getElementById("address").value =
            "Location: https://www.google.com/maps?q=" +
            lat + "," + lon;
        },
        function() {
          alert("Please allow location permission to use your current location.");
        }
      );
    }

    function submitOrder() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const address = document.getElementById("address").value;

      if (!name || !phone || !address) {
        alert("Please fill in your name, phone number and address.");
        return;
      }

      alert(
        "Order received!\\n\\n" +
        "Product: " + selectedProduct + "\\n" +
        "Price: Rs. " + selectedPrice + "\\n" +
        "Name: " + name + "\\n" +
        "Phone: " + phone
      );
    }
  </script>

</body>
</html>
